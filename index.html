<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נתונים</title>
<style>
  body{font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#F4F5F2;
       color:#1A2430;margin:0;padding:30px 20px}
  .box{max-width:620px;margin:0 auto;background:#fff;border:1px solid #DCDFD9;border-radius:4px}
  h1{margin:0;padding:16px 20px;font-size:18px;border-bottom:1px solid #DCDFD9}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th{background:#FAFAF7;text-align:right;font-size:13px;color:#6B7787;padding:10px 20px;
     border-bottom:1px solid #DCDFD9}
  td{padding:10px 20px;border-bottom:1px solid #EDEFE9}
  tr:last-child td{border-bottom:none}
  .msg{padding:24px 20px;color:#A34832}
</style>
</head>
<body>

<div class="box">
  <h1>נתונים</h1>
  <div id="out" class="msg" style="color:#96A1AE">טוען…</div>
</div>

<script>
fetch("data.csv?t=" + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error("הקובץ לא נמצא (סטטוס " + r.status + ")");
    return r.text();
  })
  .then(function (text) {
    // פירוק לשורות, לקיחת 3 העמודות הראשונות ו-10 שורות הנתונים הראשונות
    var lines = text.trim().split(/\r?\n/);
    var head  = lines[0].split(",").slice(0, 3);
    var rows  = lines.slice(1, 11).map(function (l) { return l.split(",").slice(0, 3); });

    var html = "<table><thead><tr>";
    head.forEach(function (h) { html += "<th>" + h + "</th>"; });
    html += "</tr></thead><tbody>";
    rows.forEach(function (r) {
      html += "<tr>";
      for (var i = 0; i < 3; i++) { html += "<td>" + (r[i] || "") + "</td>"; }
      html += "</tr>";
    });
    html += "</tbody></table>";

    document.getElementById("out").outerHTML = html;
  })
  .catch(function (e) {
    document.getElementById("out").textContent =
      e.message + ". אם פתחת את הקובץ בדאבל־קליק, הרץ שרת מקומי במקום.";
  });
</script>
</body>
</html>
